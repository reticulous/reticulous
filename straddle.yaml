# reticulous/reticulous — the buildable that assembles a Reticulum / LXMF /
# Nomad Network device image.
#
# It carries NO firmware or board HAL of its own. It pulls in the reticulous
# mesh straddles + the spangap IP/web platform via additional_installs below,
# ships the Quasar browser SPA (web-interface/), the LittleFS data image (data/)
# and the LCD launcher icons (assets/lcd-icons/); its main/ is just the build-
# generated app_main + start/init dispatchers.
#
# Build it WITH a board straddle — the board supplies the pin maps, the board
# bring-up hooks, and the hardware kconfig (flash size, PSRAM mode, display):
#   spangap build reticulous/reticulous --with spangap/hw-lilygo-tdeck
#   spangap build reticulous/reticulous --with spangap/hw-heltecv4
schema_version: 1
name: reticulous/reticulous
prefix: reticulous
version: 0.0.0
# Firmware identity (immutable; exposed read-only to the browser as fw.*).
# reticulous is the built straddle here, so it wins these over every dep.
stub: reticulous
display_name: Reticulous
banner: Reticulum mesh networking for the masses!
default_hostname: reticulous
# The RNode-over-TCP door (iface-lora's `s.lora.rnode.tcp`): an RNS
# `RNodeInterface` client dials 7633 and nothing else, so the container bridge
# must front exactly this port for an in-container reference client to attach.
# One-line flow list — the host tooling reads it with a sed, not a YAML parser.
bridge_ports: [7633]
# What a fresh workspace's `builds/local` catalogue starts out as: the published
# `dev` catalogue, whose entries are every board this project builds for. Copied
# once by the first `spangap flashmon`; after that the file is the user's.
catalogue_seed: https://reticulous.net/builds/dev/builds.yaml
firmware: esp-idf
browser: web-interface
platforms: [idf]
# First-run setup on a device with a screen: a fresh node is walked through a
# password, a name and a network on its own panel, before the launcher is
# reachable — the same three answers flashmon asks for over serial,
# for a node handed over with neither cable nor browser. Gated on the screen
# being in the build, so a headless board compiles none of it
# (esp-idf/main/conditional/spangap-lcd/src/onboard_lcd.cpp). The buildable inits
# last, so storage, auth, net and the shell are all up by the time it runs.
init:
  - call: reticulousOnboardInit
    when: spangap/spangap-lcd
# The kitchen sink, in one place: the full reticulous mesh + the spangap IP/web
# platform. All default-on and droppable with `spangap build --without <name>`
# (the cascade takes hard dependents with it). Notes:
#   - The remote-access services (ACME / UPnP / WireGuard / DuckDNS) are NOT
#     listed here — spangap-net additional-installs them, so requiring net is
#     enough.
#   - The on-device LCD UI is NOT listed here either — it rides on the board: a
#     board with a screen (hw-lilygo-tdeck) additional-installs spangap-lcd itself, so
#     a screenless board (hw-heltecv4) builds headless with no extra flags.
#   - Nor is the LoRa radio: iface-lora rides on the board the same way, so a
#     board with a modem (hw-heltecv4) additional-installs it — and the two
#     straddles that are about the radio rather than about this image, LoRaMon
#     and the RNode Bluetooth door, come with it — while a radioless board
#     (hw-waveshare-28b) gets no LoRa settings section, no s.lora.* keys and no
#     launcher tile for a radio it hasn't got. The interfaces here are the ones
#     every board can run.
additional_installs:
  - reticulous/rns
  - reticulous/rnsh
  - reticulous/iface-tcp
  - reticulous/iface-auto
#  - reticulous/iface-espnow
  - reticulous/iface-ble
  - reticulous/lxmf
# lxmproxy is opt-in, not default-on: hosting somebody's account is a ROLE a
# particular node is given, not a capability every node wants, and it is the one
# straddle here that spends the state store on another device's mail. The client
# half lives in lxmf and every node has it. Build the server with
# `spangap build --with reticulous/lxmproxy`.
#  - reticulous/lxmproxy
  - reticulous/nomad
  - reticulous/maps
  - spangap/spangap-net
  - spangap/spangap-web
  - spangap/viewer
# The top-level mesh menu, named and ordered here and left empty: every mesh
# straddle (rns, the interfaces, lxmf, nomad, rnsh) contributes under
# `id: reticulum` and states nothing but that id. The buildable is the right
# place for the name because it arrives last — naming is last-setter-wins, so
# whatever assembles the image has the final say over the tree it ships.
#
# The menu is flat: rns puts its rows on this page (rows render before children),
# and each interface is a child of it rather than of an interfaces sub-menu —
# the interfaces are the substance of the mesh menu, not a category within it.
settings:
  - at: [ { id: reticulum, label: "Reticulum Mesh", short: "Mesh", order: 15 } ]
# The order this image offers its apps in — the panel's launcher grid and the
# browser's dock from one list. It is stated here for the same reason the mesh
# menu is named here: the order is about the image as a whole — the mesh apps
# first, then the panes you go to rather than live in — and the buildable is the
# only straddle that can see all of it.
#
# The list spans both surfaces, and a name for an app a surface hasn't got is
# ignored there: Maps is the panel's alone, NetGraph and the screen mirror the
# browser's. "Viewer" is the app the panel labels Info and the browser labels
# Viewer — the icon name is what they share, and either surface matches a name
# against its apps' labels and icon names alike.
#
# Anything not named (a `--with` straddle's app, a board's) falls in after these,
# in each surface's own default order, and on the panel the operator's own drag
# (s.lcd.launcher_order) outranks the lot.
app_order: [LXMF, Nomad, LoRaMon, Maps, Settings, Log, CLI, Activity, NetGraph, Viewer, LcdMirror]
